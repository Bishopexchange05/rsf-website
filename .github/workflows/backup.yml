# Nightly encrypted backup of the DEVELOPMENT database (see docs/OPERATIONS-PLAN.md section 4 and
# docs/RESTORE.md). The work is in ops/backup.sh. This file only sets it up and tells the monitor.
#
# Triggers: the schedule below, and the "Run workflow" button in the Actions tab.

name: Backup

on:
  schedule:
    - cron: "43 2 * * *"
    # A second run later the same day, so one late or dropped run still leaves a backup for the day.
    # It simply replaces that day's files with a newer copy.
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      scratch:
        # A throwaway database used only to prove each backup can be restored. It is not a secret.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: scratch-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HC_URL: ${{ secrets.HC_BACKUP_URL }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Postgres 17 tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          # The runner already has an older Postgres 16 on its path. Put 17 first so pg_dump matches the server.
          echo "/usr/lib/postgresql/17/bin" >> "${GITHUB_PATH}"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Back up, test the restore, encrypt and store
        env:
          SRC_DB_URL: ${{ secrets.DEV_DB_BACKUP_URL }}
          SCRATCH_DB_URL: postgresql://postgres:scratch-only@localhost:5432/postgres
          GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
          BACKUP_REPO: ${{ github.repository_owner }}/rsf-backups
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: bash ops/backup.sh

      - name: Tell the monitor it worked
        run: |
          if [ -z "${HC_URL}" ]; then echo "::warning::HC_BACKUP_URL is not set, so no monitor was told."; exit 0; fi
          curl -fsS -m 15 --retry 3 --retry-delay 5 -o /dev/null "${HC_URL}"
          echo "Monitor told."

      - name: Tell the monitor it failed
        if: failure()
        run: |
          if [ -n "${HC_URL}" ]; then curl -fsS -m 15 --retry 3 -o /dev/null "${HC_URL%/}/fail" || true; fi

      - name: Ask GitHub to keep this schedule switched on
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable backup.yml --repo "${GITHUB_REPOSITORY}"
