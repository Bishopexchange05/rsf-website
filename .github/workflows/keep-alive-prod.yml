# Keep-alive for the PRODUCTION database (the twin of keep-alive.yml, which watches development).
# Twice a day (05:07 and 17:37 UTC) it asks the production database one small question so Supabase never
# sees the free project as inactive, then pings its own Healthchecks.io monitor.
#
# SAFE UNTIL SET UP: while the three production secrets below do not exist, this workflow does nothing
# at all (no failure, no ping). It starts working by itself once you add them
# (docs/PRODUCTION-LAUNCH.md, part B). It prints no keys.
#
# Secrets used: PROD_SUPABASE_URL, PROD_SUPABASE_PUBLISHABLE_KEY, HC_KEEPALIVE_PROD_URL.
# Triggers: the schedule below, and the "Run workflow" button in the Actions tab.

name: Keep-alive (production)

on:
  schedule:
    - cron: "7 5 * * *"
    - cron: "37 17 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: keep-alive-prod
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
      HC_URL: ${{ secrets.HC_KEEPALIVE_PROD_URL }}
    steps:
      - name: Check that production is set up
        id: guard
        run: |
          if [ -z "${SUPABASE_URL}" ] && [ -z "${SUPABASE_KEY}" ]; then
            echo "Production is not set up yet (no PROD secrets). Nothing to do."
            echo "go=no" >> "${GITHUB_OUTPUT}"
          else
            echo "go=yes" >> "${GITHUB_OUTPUT}"
          fi

      - name: Ask the production database a question
        if: steps.guard.outputs.go == 'yes'
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_KEY}" ]; then
            echo "::error::A required secret is missing (PROD_SUPABASE_URL or PROD_SUPABASE_PUBLISHABLE_KEY)."
            exit 1
          fi
          code=$(curl -sS -o answer.json -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 5 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/get_public_settings" \
            -H "apikey: ${SUPABASE_KEY}" -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered with HTTP status ${code}."
          if [ "${code}" != "200" ]; then
            echo "::error::Supabase did not answer normally (HTTP ${code}). The project may be paused or the key is wrong."
            exit 1
          fi
          if ! grep -q "booking_enabled" answer.json; then
            echo "::error::Supabase answered, but not with the expected content."
            exit 1
          fi
          echo "The database answered correctly."

      - name: Tell the monitor it worked
        if: steps.guard.outputs.go == 'yes'
        run: |
          if [ -z "${HC_URL}" ]; then echo "::warning::HC_KEEPALIVE_PROD_URL is not set, so no monitor was told."; exit 0; fi
          curl -fsS -m 15 --retry 3 --retry-delay 5 -o /dev/null "${HC_URL}"
          echo "Monitor told."

      - name: Tell the monitor it failed
        if: failure() && steps.guard.outputs.go == 'yes'
        run: |
          if [ -n "${HC_URL}" ]; then curl -fsS -m 15 --retry 3 -o /dev/null "${HC_URL%/}/fail" || true; fi

      - name: Ask GitHub to keep this schedule switched on
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keep-alive-prod.yml --repo "${GITHUB_REPOSITORY}"
